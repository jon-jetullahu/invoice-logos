name: profinance-platform

on:
  push:
    paths: ['profinance-platform/**', '.github/workflows/profinance-platform.yml']
  pull_request:
    paths: ['profinance-platform/**', '.github/workflows/profinance-platform.yml']

defaults:
  run:
    working-directory: profinance-platform

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: profinance-platform/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run data
      - run: npx tsc --noEmit
      - run: npm test
      - run: pip install -r collection/requirements.txt
      - run: npm run test:py
      - run: npm run build
      - run: npm run report
